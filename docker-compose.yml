version: '3.8'

services:
  # Database Service: PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: shield_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: shield_user
      POSTGRES_PASSWORD: shield_password
      POSTGRES_DB: shield_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shield_user -d shield_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend Service: FastAPI + SQLAlchemy + STIX 2.1
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shield_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://shield_user:shield_password@db:5432/shield_db
      - SECRET_KEY=soc-enterprise-shield-secret-token-key-change-in-prod
      - PROJECT_NAME=SHIELD SOC Threat Intelligence Platform
      - ENVIRONMENT=production
    ports:
      - "8000:8000"

  # Frontend Service: React.js (Vite) + Tailwind CSS + NGINX SPA
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shield_frontend
    restart: unless-stopped
    depends_on:
      - backend

  # Reverse Proxy & Ingress: NGINX
  nginx:
    image: nginx:alpine
    container_name: shield_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
