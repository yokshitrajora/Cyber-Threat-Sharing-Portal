version: '3.8'

services:
  # ─── Database Service: PostgreSQL 16 ───
  db:
    image: postgres:16-alpine
    container_name: shield_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shield_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shield_password_prod_secure}
      POSTGRES_DB: ${POSTGRES_DB:-shield_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shield_user} -d ${POSTGRES_DB:-shield_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Cache & Task Broker: Redis 7 ───
  redis:
    image: redis:7-alpine
    container_name: shield_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Backend Service: FastAPI SOC Core ───
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shield_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-shield_user}:${POSTGRES_PASSWORD:-shield_password_prod_secure}@db:5432/${POSTGRES_DB:-shield_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-soc-enterprise-shield-secret-token-key-change-in-prod}
      - PROJECT_NAME=Shield AI Threat Intelligence SOC Core
      - ENVIRONMENT=production
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY:-}
      - ABUSEIPDB_API_KEY=${ABUSEIPDB_API_KEY:-}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
      - ALERT_EMAIL_FROM=${ALERT_EMAIL_FROM:-alerts@shieldcommunity.io}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─── Celery Background Worker ───
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shield_celery_worker
    restart: unless-stopped
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info -c 4
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-shield_user}:${POSTGRES_PASSWORD:-shield_password_prod_secure}@db:5432/${POSTGRES_DB:-shield_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY:-}
      - ABUSEIPDB_API_KEY=${ABUSEIPDB_API_KEY:-}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
      - ALERT_EMAIL_FROM=${ALERT_EMAIL_FROM:-alerts@shieldcommunity.io}

  # ─── Celery Beat (Scheduled Weekly Digest Trigger) ───
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shield_celery_beat
    restart: unless-stopped
    command: celery -A app.core.celery_app.celery_app beat --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-shield_user}:${POSTGRES_PASSWORD:-shield_password_prod_secure}@db:5432/${POSTGRES_DB:-shield_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0

  # ─── Frontend Service: React 19 (Vite) + Tailwind CSS ───
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shield_frontend
    restart: unless-stopped
    depends_on:
      - backend

  # ─── Reverse Proxy Ingress & SSL Terminator: NGINX ───
  nginx:
    image: nginx:alpine
    container_name: shield_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
